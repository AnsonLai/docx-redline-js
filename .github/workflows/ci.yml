name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Isolation checks
        run: npm run test:isolation

      - name: Test suite
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Pack dry-run (Node 20 only)
        if: matrix.node-version == 20
        run: npm pack --dry-run
